name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Test filing parser
        run: npm test --workspace @corptrace/api
      - name: Type-check API
        run: npm run typecheck --workspace @corptrace/api
      - name: Build web app
        run: npm run build --workspace @corptrace/web
