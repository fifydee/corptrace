name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Audit dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Test filing parser
        run: npm test --workspace @corptrace/api
      - name: Type-check API
        run: npm run typecheck --workspace @corptrace/api
      - name: Validate Cloudflare Worker bundle and configuration
        run: npm exec --workspace @corptrace/api -- wrangler deploy --dry-run --outdir /tmp/corptrace-worker
      - name: Build web app
        run: npm run build --workspace @corptrace/web

  live-company-source-qa:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Exercise live company-source discovery
        run: CORPTRACE_RUN_EXTERNAL_SOURCE_QA=1 npm run test:live --workspace @corptrace/api
        env:
          CORPTRACE_SEC_USER_AGENT: "CorpTrace live source QA/0.1 (corptrace@protonmail.com)"
      - name: Upload live company-source QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-company-source-qa-report
          path: apps/api/live-company-source-qa-report.json
          if-no-files-found: ignore

  live-sec-qa:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Exercise CorpTrace against live SEC filings
        run: npm run test:live --workspace @corptrace/api
        env:
          CORPTRACE_SEC_USER_AGENT: "CorpTrace live SEC QA/0.1 (corptrace@protonmail.com)"
      - name: Upload live SEC QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-sec-qa-report
          path: apps/api/live-sec-qa-report.json
          if-no-files-found: ignore
